<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenIDM - Unduhan baru</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="dark confirm-body">
  <main class="confirm-shell" aria-labelledby="confirm-title">
    <header class="confirm-head">
      <div class="brand-logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
          <polyline points="7 10 12 15 17 10"></polyline>
          <line x1="12" y1="15" x2="12" y2="3"></line>
        </svg>
      </div>
      <div>
        <h1 id="confirm-title">Unduh dengan OpenIDM?</h1>
        <p class="confirm-source" id="confirm-source">Memuat</p>
      </div>
    </header>

    <div class="form-group">
      <label for="confirm-filename">Nama berkas</label>
      <input type="text" id="confirm-filename" spellcheck="false" autocomplete="off" maxlength="180">
    </div>

    <dl class="confirm-facts">
      <div><dt>Ukuran</dt><dd id="confirm-size">-</dd></div>
      <div><dt>Jenis</dt><dd id="confirm-category">-</dd></div>
      <div class="wide"><dt>Simpan ke</dt><dd id="confirm-dir" class="mono">-</dd></div>
    </dl>

    <p class="field-error hidden" id="confirm-error" role="alert"></p>

    <footer class="confirm-actions">
      <button type="button" class="btn btn-secondary" id="confirm-cancel" title="Biarkan browser yang mengunduh">Batal</button>
      <span class="footer-spacer"></span>
      <button type="button" class="btn btn-secondary" id="confirm-later" title="Simpan ke daftar, unduh nanti">Nanti</button>
      <button type="button" class="btn btn-primary" id="confirm-start">Mulai unduh</button>
    </footer>
  </main>
  <script src="confirm.js"></script>
</body>
</html>
